<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cookhemistry</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">  <!-- Login Header -->
                <div class="company-logo">Cookhemistry</div>
                <a href="index.html" class="close-button">&times;</a>
            </div>
            <div class="login-body"> <!-- Login Body -->
                <h2>Sign in</h2>
                <p>Sign in using your social media account or email address</p>
                <form id="loginForm"> <!-- Login Form -->
                    <div class="form-group mb-3">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    </div>
                    <div class="form-group mb-3">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-danger sign-in-button w-100">Sign In</button>
                </form>
                <p class="social-profiles-text">Or continue with your social profile</p> <!-- Social Profiles Login Buttons -->
                <div class="social-buttons">
                    <button class="btn btn-primary twitter-button">Twitter</button>
                    <button class="btn btn-primary facebook-button">Facebook</button>
                </div>
                <div class="forgot-signup-links mt-3">
                    <a href="#" class="forgot-password">Forgot Password</a> <!-- Reset Password-->
                    <a href="signup.html" class="sign-up">Sign Up</a> <!-- Sign Up Link-->
                </div>
                <div id="loginError" class="text-danger mt-2"></div> <!-- Error Message Display -->
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('loginError');

            // Validation
      if (!email || !password) {
        errorDiv.textContent = "Both fields are required.";
        return;
      }

      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        localStorage.setItem('currentUser', JSON.stringify(user));
        window.location.href = 'myprofile.html';
      } else {
        errorDiv.textContent = "Invalid email or password.";
      }
        });
    </script>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script> 
</body>
</html>
