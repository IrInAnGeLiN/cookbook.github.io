<script>
      document.addEventListener("DOMContentLoaded", function() {     

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

    // Redirect to login if not logged in
    if (!currentUser) {
        alert("Please log in to see your favorites.");
        window.location.href = "login.html";
        return; // Stop further execution
    }

        // Display favorites
        const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        const listDiv = document.getElementById('favorites-list');

        if (favorites.length === 0) {
            listDiv.innerHTML = `<div class="col-12 text-center text-muted">No favorites saved yet.</div>`;
        } else {
            listDiv.innerHTML = favorites.map((recipe, index) => `
                <div class="col-md-4 col-12">
                    <div class="card shadow-sm h-100">
                        <img src="${recipe.image}" class="card-img-top" alt="${recipe.title}" style="max-height:200px;object-fit:cover;">
                        <div class="card-body">
                            <h5 class="card-title">${recipe.title}</h5>
                            <a href="${recipe.url}" class="btn btn-primary mb-2" target="_blank"><i class="fas fa-utensils"></i> View Recipe</a>
                            <button class="btn btn-danger btn-remove-fav" data-index="${index}"><i class="fas fa-trash"></i> Remove</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Remove favorite
        listDiv.addEventListener('click', function(e) {
          if (e.target.classList.contains('btn-remove-fav') || e.target.closest('.btn-remove-fav')) {
            const btn = e.target.closest('.btn-remove-fav');
            const idx = Number(btn.getAttribute('data-index'));
            favorites.splice(idx,1);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            window.location.reload();
          }
        });
      });
    </script>
